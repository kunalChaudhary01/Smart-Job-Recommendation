{% extends "base.html" %}

{% block title %}404 - Page Not Found | SmartJob{% endblock %}

{% block body %}
<div class="error-wrapper">
    <div class="card p-5 text-center shadow-sm" style="max-width: 520px; width: 100%;">
        <div class="error-code">404</div>
        <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
        <p class="text-secondary mb-4">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/dashboard" class="btn btn-primary"><i class="bi bi-grid-1x2-fill me-1"></i>Go to Dashboard</a>
            <a href="/" class="btn btn-outline-secondary"><i class="bi bi-house me-1"></i>Home</a>
        </div>
    </div>
</div>
{% endblock %}
