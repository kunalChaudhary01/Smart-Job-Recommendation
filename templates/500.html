{% extends "base.html" %}

{% block title %}500 - Server Error | SmartJob{% endblock %}

{% block body %}
<div class="error-wrapper">
    <div class="card p-5 text-center shadow-sm" style="max-width: 520px; width: 100%;">
        <div class="error-code text-danger">500</div>
        <h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
        <p class="text-secondary mb-4">
            Something unexpected occurred on our servers. Our team has been notified, and we're working to fix it.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/dashboard" class="btn btn-primary"><i class="bi bi-arrow-clockwise me-1"></i>Return to Dashboard</a>
            <a href="/" class="btn btn-outline-secondary"><i class="bi bi-house me-1"></i>Home</a>
        </div>
    </div>
</div>
{% endblock %}
