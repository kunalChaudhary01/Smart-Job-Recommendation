{% extends "base_dashboard.html" %}
{% block page_title %}Edit Profile{% endblock %}
{% block dashboard_content %}
<div class="card">
    <div class="card-body">
        <form method="POST" action="/profile/edit">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Location</label>
                    <input type="text" name="location" class="form-control" value="{{ user.location or '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Expected Salary (LPA)</label>
                    <input type="number" step="0.01" name="expected_salary" class="form-control" value="{{ user.expected_salary or '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label">Bio</label>
                    <textarea name="bio" class="form-control" rows="3">{{ user.bio or '' }}</textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Skills (comma-separated)</label>
                    <input type="text" name="skills" class="form-control" value="{{ user.skills or '' }}" placeholder="python, javascript, sql...">
                </div>
                <div class="col-12">
                    <label class="form-label">Education</label>
                    <textarea name="education" class="form-control" rows="3">{{ user.education or '' }}</textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Experience</label>
                    <textarea name="experience" class="form-control" rows="3">{{ user.experience or '' }}</textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Changes</button>
                <a href="/profile" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>

<!-- Skill Management -->
<div class="card mt-4">
    <div class="card-body">
        <h6><i class="bi bi-plus-circle me-2"></i>Quick Add Skill</h6>
        <form method="POST" action="/profile/skills/add" class="d-flex gap-2 mt-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="text" name="skill" class="form-control" placeholder="Enter a skill..." required>
            <button type="submit" class="btn btn-primary">Add</button>
        </form>
        {% if user.skills %}
        <div class="mt-3">
            {% for skill in user.skills.split(',') %}
            {% if skill.strip() %}
            <span class="skill-chip neutral d-inline-flex align-items-center gap-1">
                {{ skill.strip() }}
                <form action="/profile/skills/remove" method="POST" class="d-inline" style="margin:0">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="skill" value="{{ skill.strip() }}">
                    <button type="submit" class="remove-skill" style="background:none;border:none;padding:0;margin-left:4px;color:#94a3b8;cursor:pointer;font-size:1.1rem;line-height:1;" title="Remove">&times;</button>
                </form>
            </span>
            {% endif %}
            {% endfor %}
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
